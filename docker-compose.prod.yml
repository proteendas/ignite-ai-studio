# Production override for EC2 deployment: app + chroma stay internal-only,
# Caddy is the sole public entrypoint (ports 80/443).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
services:
  app:
    ports: !reset []
    expose:
      - '3000'
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgres://igniteai:${POSTGRES_PASSWORD}@postgres:5432/igniteai?sslmode=disable
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-pgvector}
      - CHROMA_URL=http://chroma:8000

  postgres:
    # Never publish the database port in production — Caddy is the only thing
    # that should be reachable from outside the compose network.
    ports: !reset []
    expose:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}

  chroma:
    ports: !reset []
    expose:
      - '8000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    env_file:
      - .env.production

volumes:
  caddy_data:
  caddy_config:
